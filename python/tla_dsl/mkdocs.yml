site_name: TLA DSL Docs
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections

nav:
  - Overview: index.md
  - Environment Variables: environment_variables.md
  - Torch Tensor Binding: framework_integration.md
  - Dynamic Layout: dsl_dynamic_layout.md
  - Kernel API Reference: kernel-api-reference.md
  - Kernel API Reference (中文): kernel-api-reference.zh.md
  - Control Flow: control_flow.md
  - Core API Reference: api-reference.md
  - DSL Syntax Constraints: dsl_python_syntax_guide.md
  - DSL Syntax Constraints (English): dsl_python_syntax_guide_en.md
  - BC Backend Integration: bc-backend-integration.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true # 使用现代选项卡样式

validation:
  links:
    not_found: ignore
